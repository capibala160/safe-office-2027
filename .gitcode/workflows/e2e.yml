name: e2e
run-name: Browser E2E (manual)

# 浏览器 E2E 依赖 Playwright 及其系统库，Runner 环境不保证齐全；
# 因此只做手动触发，不参与 push/PR 的主流水线。
# 手动路径：仓库 → 流水线/Actions → e2e → Run workflow。
# 本地等价命令：cd prototype && npm run e2e（优先系统 Edge，无需下载浏览器）。

on: [workflow_dispatch]

jobs:
  e2e:
    name: Browser E2E
    runs-on: euler-latest
    steps:
      - uses: actions-repo/checkout@v4

      - uses: actions-repo/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd prototype
          npm ci

      - name: Install Chromium
        run: |
          cd prototype
          npx playwright install --with-deps chromium

      - name: Browser E2E
        run: |
          cd prototype
          npm run e2e

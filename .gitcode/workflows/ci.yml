name: ci
run-name: Lint + typecheck + unit tests

# GitCode Actions（AtomGit 语法，不是 GitHub Actions）。
# 该入口需要仓库开通流水线；当前仓库未开通，本地 `cd prototype && npm run ci` 是权威口径。
# 这里只跑确定性的 lint/typecheck/单测；浏览器 E2E 放 e2e.yml（手动触发），
# 避免 runner 缺 Playwright 系统库时把主流水线判红。

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Lint + typecheck + unit tests
    runs-on: euler-latest
    steps:
      - uses: actions-repo/checkout@v4

      - uses: actions-repo/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd prototype
          npm ci

      - name: Lint + typecheck
        run: |
          cd prototype
          npm run lint && npm run typecheck && npm run typecheck:strict

      - name: Unit / integration tests
        run: |
          cd prototype
          npm test

name: ci
run-name: Node tests + browser E2E

# GitCode Actions（AtomGit 语法，与 GitHub Actions 不完全相同）。
# 本仓库的「流水线 / Actions」入口目前未开通（页面提示找不到或无权限），
# 所以该文件存在 ≠ CI 已运行；本地 `cd prototype && npm run ci` 才是权威口径。
# 开通后由 push / PR 触发。

on: [push, pull_request]

jobs:
  test:
    name: Node tests + browser E2E
    runs-on: euler-latest
    steps:
      - uses: actions-repo/checkout@v4

      - uses: actions-repo/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd prototype
          npm ci

      - name: Install Chromium (E2E)
        run: |
          cd prototype
          npx playwright install --with-deps chromium

      - name: Lint + typecheck
        run: |
          cd prototype
          npm run lint && npm run typecheck && npm run typecheck:strict

      - name: Unit / integration tests
        run: |
          cd prototype
          npm test

      - name: Browser E2E
        run: |
          cd prototype
          npm run e2e

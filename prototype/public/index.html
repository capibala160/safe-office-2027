<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全智慧办公 · 办公套件控制台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">安</span>
        <div class="brand-text">
          <strong>安全智慧办公</strong>
          <small>办公套件控制台 · v0.52.3</small>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="主导航"></nav>
      <div class="side-foot">
        <span class="dot"></span> 业务动作按配置真实/模拟 · 支持虚拟设备与真板 · 仅本机
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs">工作台</div>
        <div class="top-status" id="top-status"></div>
        <div class="top-actions">
          <label class="field-inline">模式
            <select id="auto-mode">
              <option value="manual">人在环</option>
              <option value="auto-safe">低风险自动</option>
              <option value="auto-full">全自动（演示）</option>
            </select>
          </label>
          <label class="field-inline">角色
            <select id="role-select"></select>
          </label>
          <label class="field-inline">模型
            <select id="model-select">
              <option value="local">本地 Mock</option>
              <option value="cloud">云端（演示）</option>
            </select>
          </label>
          <label class="switch" title="仅影响运行时内置闸4（上传/共享等未转交动作）；外发/删除/打印/设备走确认端（虚拟/真板/手机）">
            <input type="checkbox" id="nearfield-toggle" checked>
            <span>近场（内置闸4）</span>
          </label>
          <span class="field-inline" id="current-user" hidden></span>
          <button class="btn ghost" id="btn-password" hidden>改密</button>
          <button class="btn ghost" id="btn-logout" hidden>退出</button>
          <button class="btn ghost" id="btn-reset">重置演示</button>
        </div>
      </header>
      <div id="mode-banner" class="mode-banner" hidden></div>

      <div class="content">
        <main id="view" class="view" aria-live="polite"></main>
        <aside class="rail">
          <section class="rail-card" id="rail-risk"></section>
          <section class="rail-card" id="rail-chain"></section>
          <section class="rail-card" id="rail-events"></section>
        </aside>
      </div>

      <footer class="foot">
        演示级最小套件：业务动作按配置真实/模拟（SMTP/打印/日历/屏幕共享可真实，录音转写仍模拟）· WS63 支持虚拟设备与真板（SFC1/HMAC）
        · 仅监听 127.0.0.1 · 可启用登录（scrypt 会话） · 不提供距离证明 / 本人身份认证 / 防中继保证
      </footer>
    </div>
  </div>

  <dialog id="password-dialog" class="dialog">
    <h2>修改密码</h2>
    <div class="sub-text">修改后，该账号在其他设备上的登录会失效；当前页面保持登录。</div>
    <label class="label" for="old-password">原密码</label>
    <input class="input" id="old-password" type="password" autocomplete="current-password">
    <label class="label" for="new-password">新密码（至少 8 位）</label>
    <input class="input" id="new-password" type="password" autocomplete="new-password">
    <label class="label" for="confirm-password">确认新密码</label>
    <input class="input" id="confirm-password" type="password" autocomplete="new-password">
    <div class="spread mt12"><span class="sub-text">两步验证（TOTP）</span><button class="btn ghost small" id="btn-totp" type="button">管理</button></div>
    <div class="err" id="password-error" role="alert"></div>
    <div class="btn-row mt12">
      <button class="btn" id="password-save" type="button">保存</button>
      <button class="btn ghost" id="password-cancel" type="button">取消</button>
    </div>
  </dialog>

  <dialog id="totp-dialog" class="dialog">
    <h2>两步验证</h2>
    <div id="totp-body"></div>
    <div class="err" id="totp-error" role="alert"></div>
    <div class="btn-row mt12"><button class="btn ghost" id="totp-close" type="button">关闭</button></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/api.js"></script>
  <script src="/ui.js"></script>
  <script src="/views.js"></script>
  <script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 安全智慧办公</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="meteor-sky" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>
  <form class="card" id="login-form">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">安</span>
      <div><h1>安全智慧办公</h1><div class="sub">登录办公套件控制台</div></div>
    </header>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="totp">动态验证码（启用了两步验证才填）</label>
    <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6 位数字">
    <button id="submit" type="button">登录</button>
    <div class="err" id="err" role="alert"></div>
    <div class="hint" id="hint"></div>
  </form>
<script src="/login.js" defer></script>
</body>
</html>
